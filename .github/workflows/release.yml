name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to NuGet"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore ZoomMeetings.sln

      - name: Build
        run: dotnet build ZoomMeetings.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ZoomMeetings.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack ZoomMeetings.sln --configuration Release --no-build --output ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*.*nupkg

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
